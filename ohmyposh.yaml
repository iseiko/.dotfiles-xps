$schema: "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"

palette:
  white: "#f7f7f7"
  black: "#1d252c"

blocks:
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        background: transparent
        foreground: "#a0b3c5"
        template: "\u250c"

      - type: shell
        style: plain
        background: "#a0b3c5"
        foreground: p:black
        template: " \uf489 {{.Name}}\u2800"

      - type: session
        style: plain
        background: "#a0b3c5"
        foreground: p:black
        template: " \uf2c0 {{.UserName}}\ue0bd{{.HostName}}\u2800"

      - type: git
        style: plain
        background: "#ffffd6"
        foreground: p:black
        template: "{{.HEAD}}\u2800"
        options:
          branch_icon: " \ue0a0 "

  - type: prompt
    alignment: right
    segments:
      - type: executiontime
        style: plain
        background: transparent
        foreground: "#a0b3c5"
        template: "{{.FormattedMs}}"
        options:
          style: austin
          threshold: 0

      - type: time
        style: plain
        background: transparent
        foreground: "#a0b3c5"
        template: "<p:white> · </>{{.CurrentDate | date .Format}}"
        options:
          time_format: "02/01/06 15:04"

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: path
        style: plain
        background: transparent
        foreground: "#a0b3c5"
        template: "<#a0b3c5>\u2514</><#a0b3c5>[</> {{.Path}} <#a0b3c5>]</>"
        options:
          folder_icon: "\uf07b"
          folder_separator_template: "<#a0b3c5> \u00bb </>"
          home_icon: "\ueb06"
          style: agnoster

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: status
        style: plain
        background: transparent
        foreground: "#a0b3c5"
        template: "\u276f"
        options:
          always_enabled: true
        foreground_templates:
          - "{{if gt .Code 0}}#a0b3c5{{end}}"

transient_prompt:
  background: transparent
  foreground: "#ffffff"
  template: "\u276f "

console_title_template: "{{if .Root}}[root] {{end}}{{.Shell}} in <{{.Folder}}>"
final_space: true
version: 4
